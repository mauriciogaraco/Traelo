    <!-- Tema antes del primer pintado (misma lógica que src/lib/theme.ts). -->
    <script>
      (function () {
        var pref = 'light';
        try { pref = localStorage.getItem('traelo.themePreference') || pref; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
