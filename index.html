<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Enlace viejo de Vercel (*.vercel.app): llevar a la web oficial. Los pedidos hechos
         aquí no llegan a la base de datos. Añade ?noredirect=1 para probar un preview. -->
    <script>
      (function () {
        var h = location.hostname
        if (!/\.vercel\.app$/.test(h) || /[?&]noredirect=1/.test(location.search)) return
        try {
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister() })
            })
          }
          if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k) }) })
        } catch (e) {}
        location.replace('https://www.traelo-market.com' + location.pathname + location.search + location.hash)
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/traelo_512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F97316" />
    <meta name="description" content="Tráelo — Compra en negocios locales y recíbelo en casa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tráelo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tráelo — Compra local, recibe en casa</title>
    <!-- Tema antes del primer pintado (misma lógica que src/lib/theme.ts). -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('traelo.themePreference') || pref; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
